<style>

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {

}
a { color: inherit; }
#stars { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
#confetti { position: fixed; inset: 0; z-index: 50; pointer-events: none; }
main { position: relative; z-index: 1; }
section { max-width: 1120px; margin: 0 auto; padding: 72px 16px; }
.section-title { font-size: clamp(26px, 4vw, 40px); font-weight: 800; margin: 0 0 8px; letter-spacing: -.02em; }
.section-sub { color: var(--muted); margin: 0 0 36px; }
.grad { background: linear-gradient(90deg, var(--accent), var(--accent2), var(--accent3)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.panel { background: var(--panel); border: 1px solid var(--panel-border); border-radius: var(--radius); backdrop-filter: blur(10px); }

/* reveal on scroll */
.reveal { opacity: 0; transform: translateY(28px); transition: opacity .8s cubic-bezier(.2,.7,.2,1), transform .8s cubic-bezier(.2,.7,.2,1); }
.reveal.in { opacity: 1; transform: none; }

/* ---------- hero ---------- */
.hero { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding-top: 40px; }
.avatar-wrap { position: relative; width: 132px; height: 132px; margin-bottom: 26px; animation: pop 1s cubic-bezier(.2,1.6,.4,1) both; }
.avatar-wrap::before { content: ""; position: absolute; inset: -6px; border-radius: 50%; background: conic-gradient(var(--accent), var(--accent2), var(--accent3), var(--accent)); animation: spin 6s linear infinite; }
.avatar-wrap img, .avatar-wrap .ph { position: relative; width: 100%; height: 100%; border-radius: 50%; border: 5px solid var(--bg); object-fit: cover; background: var(--bg2); display: grid; place-items: center; font-size: 52px; font-weight: 800; }
.hero .hello { color: var(--muted); font-size: 18px; animation: fadeUp .8s .3s both; }
.year { font-size: clamp(96px, 20vw, 220px); font-weight: 900; line-height: .95; letter-spacing: -.05em; margin: 6px 0; display: flex; gap: .02em; }
.year span { display: inline-block; animation: digit 1s cubic-bezier(.2,1.4,.3,1) both; }
.hero h1 { font-size: clamp(22px, 3.4vw, 34px); margin: 4px 0 14px; animation: fadeUp .8s .9s both; }
.headline { max-width: 680px; color: var(--muted); font-size: 18px; min-height: 2.4em; animation: fadeUp .8s 1.1s both; }
.caret { display: inline-block; width: 2px; height: 1.1em; background: var(--accent2); vertical-align: -3px; margin-left: 2px; animation: blink 1s steps(1) infinite; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 18px; animation: fadeUp .8s 1.3s both; }
.chip { padding: 6px 14px; border-radius: 999px; border: 1px solid var(--panel-border); background: var(--panel); font-size: 14px; }
.scroll-hint { margin-top: 48px; color: var(--muted); font-size: 13px; animation: bob 2s ease-in-out infinite; }

/* ---------- stats ---------- */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; }
.stat { padding: 22px 20px; position: relative; overflow: hidden; }
.stat .num { font-size: clamp(32px, 5vw, 46px); font-weight: 800; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.stat .lbl { color: var(--muted); font-size: 14px; }
.stat .ico { font-size: 22px; line-height: 1; margin-bottom: 8px; opacity: .85; }
.fun-facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; margin-top: 14px; }
.fact { padding: 18px 20px; display: flex; gap: 14px; align-items: center; }
.fact .big { font-size: 30px; }
.fact b { display: block; font-size: 18px; }
.fact small { color: var(--muted); }

/* ---------- heatmap ---------- */
.heat-wrap { padding: 22px; overflow-x: auto; }
.heat { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 13px); gap: 3px; width: max-content; }
.heat i { width: 13px; height: 13px; border-radius: 3px; background: var(--heat0); transform: scale(0); transition: transform .4s cubic-bezier(.2,1.6,.4,1); }
.heat.in i { transform: scale(1); }
.heat i[data-l="1"] { background: var(--heat1); } .heat i[data-l="2"] { background: var(--heat2); }
.heat i[data-l="3"] { background: var(--heat3); } .heat i[data-l="4"] { background: var(--heat4); box-shadow: 0 0 8px var(--heat4); }
.heat-months { display: flex; color: var(--muted); font-size: 12px; margin-bottom: 6px; position: relative; height: 16px; }
.heat-months span { position: absolute; }
.legend { display: flex; gap: 4px; align-items: center; justify-content: flex-end; color: var(--muted); font-size: 12px; margin-top: 10px; }
.legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.tip { position: fixed; z-index: 60; padding: 6px 10px; border-radius: 8px; background: #000c; color: #fff; font-size: 12px; pointer-events: none; opacity: 0; transition: opacity .15s; white-space: nowrap; }

.charts { display: grid; grid-template-columns: 2fr 1fr; gap: 14px; margin-top: 14px; }
@media (max-width: 760px) { .charts { grid-template-columns: 1fr; } }
.chart { padding: 22px; }
.chart h3 { margin: 0 0 14px; font-size: 16px; }
.bars { display: flex; align-items: flex-end; gap: 6px; height: 180px; }
.bar { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 6px; }
.bar .fill { width: 100%; border-radius: 6px 6px 3px 3px; background: linear-gradient(180deg, var(--accent2), var(--accent)); height: 0; transition: height 1.1s cubic-bezier(.2,.8,.2,1); position: relative; }
.bar .fill.top { background: linear-gradient(180deg, var(--accent3), var(--accent)); box-shadow: 0 0 16px var(--accent3); }
.bar span { font-size: 11px; color: var(--muted); }
.clock { display: block; margin: 0 auto; max-width: 240px; width: 100%; }
.clock .h { transform-origin: 120px 120px; transform: scaleY(0); transition: transform .9s cubic-bezier(.2,.8,.2,1); }
.clock.in .h { transform: scaleY(1); }

/* languages */
.langbar { display: flex; height: 18px; border-radius: 999px; overflow: hidden; background: var(--heat0); }
.langbar div { width: 0; transition: width 1.2s cubic-bezier(.2,.8,.2,1); }
.langs { display: flex; flex-wrap: wrap; gap: 10px 22px; margin-top: 16px; }
.langs span { display: flex; align-items: center; gap: 8px; font-size: 14px; }
.langs i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.langs em { color: var(--muted); font-style: normal; }

/* ---------- projects ---------- */
.projects { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
.proj { padding: 22px; display: flex; flex-direction: column; gap: 10px; position: relative; overflow: hidden; transition: transform .3s, border-color .3s; }
.proj:hover { transform: translateY(-4px); border-color: var(--accent); }
.proj::after { content: ""; position: absolute; left: 0; top: 0; height: 3px; width: 100%; background: var(--lc, var(--accent)); }
.proj .rank { position: absolute; right: 16px; top: 12px; font-size: 40px; font-weight: 900; opacity: .09; }
.proj h3 { margin: 0; font-size: 19px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.proj h3 a { text-decoration: none; }
.proj h3 a:hover { text-decoration: underline; }
.badge { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: color-mix(in srgb, var(--accent2) 22%, transparent); color: var(--accent2); }
.badge.cat { background: color-mix(in srgb, var(--accent) 22%, transparent); color: var(--accent); }
.badge.priv { background: var(--heat0); color: var(--muted); }
.proj .tagline { font-weight: 600; }
.proj .desc { color: var(--muted); font-size: 14px; margin: 0; }
.proj ul { margin: 0; padding-left: 18px; font-size: 14px; }
.proj ul li { margin: 3px 0; }
.proj .meta { display: flex; gap: 14px; flex-wrap: wrap; color: var(--muted); font-size: 13px; margin-top: auto; padding-top: 6px; }
.proj .meta i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 5px; vertical-align: -1px; }
.topics { display: flex; flex-wrap: wrap; gap: 6px; }
.topics span { font-size: 12px; padding: 2px 8px; border-radius: 6px; background: var(--heat0); color: var(--muted); }

/* ---------- achievement cards ---------- */
.ach-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 20px; perspective: 1200px; }
.card { --tc: var(--common); aspect-ratio: 5 / 7; position: relative; cursor: pointer; transform-style: preserve-3d; transition: transform .25s ease-out; }
.card[data-tier="rare"] { --tc: var(--rare); } .card[data-tier="epic"] { --tc: var(--epic); } .card[data-tier="legendary"] { --tc: var(--legendary); }
.card .inner { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .9s cubic-bezier(.3,1.3,.4,1); transform: rotateY(180deg); }
.card.dealt .inner { transform: rotateY(0); }
.card.dealt.flipped .inner { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; border-radius: 20px; backface-visibility: hidden; -webkit-backface-visibility: hidden; overflow: hidden; display: flex; flex-direction: column; align-items: center; text-align: center; padding: 20px 16px; border: 2px solid color-mix(in srgb, var(--tc) 70%, transparent); background: radial-gradient(120% 80% at 50% 0%, color-mix(in srgb, var(--tc) 30%, var(--bg2)) 0%, var(--bg2) 60%); box-shadow: 0 10px 40px -12px color-mix(in srgb, var(--tc) 60%, transparent); }
.face.back { transform: rotateY(180deg); justify-content: center; gap: 10px; }
.face .tier { font-size: 11px; letter-spacing: .18em; text-transform: uppercase; font-weight: 800; color: var(--tc); }
.face .emblem { width: 96px; height: 96px; margin: 16px 0 12px; border-radius: 50%; display: grid; place-items: center; font-size: 50px; background: radial-gradient(circle, color-mix(in srgb, var(--tc) 40%, transparent), transparent 70%); position: relative; }
.face .emblem::before { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 2px dashed color-mix(in srgb, var(--tc) 60%, transparent); animation: spin 14s linear infinite; }
.face h4 { margin: 0 0 6px; font-size: 20px; }
.face p { margin: 0; color: var(--muted); font-size: 13px; }
.face .val { margin-top: auto; font-size: 30px; font-weight: 900; color: var(--tc); font-variant-numeric: tabular-nums; }
.face .val small { font-size: 13px; font-weight: 600; color: var(--muted); margin-left: 3px; }
.pips { display: flex; gap: 5px; margin-top: 8px; }
.pips i { width: 22px; height: 5px; border-radius: 3px; background: var(--heat0); }
.pips i.on { background: var(--tc); box-shadow: 0 0 6px var(--tc); }
.face .shine { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,.28) 45%, transparent 60%); background-size: 250% 100%; background-position: var(--sx, 120%) 0; mix-blend-mode: overlay; }
.card[data-tier="epic"] .face.front::after, .card[data-tier="legendary"] .face.front::after {
  content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .35; mix-blend-mode: color-dodge;
  background: linear-gradient(125deg, #ff008055, #ffcc0055, #00ffaa55, #00aaff55, #aa00ff55, #ff008055); background-size: 300% 300%; animation: holo 6s ease infinite;
}
.card[data-tier="legendary"]::before { content: ""; position: absolute; inset: -3px; border-radius: 23px; background: conic-gradient(from var(--ang, 0deg), var(--legendary), #fff6, var(--accent3), var(--legendary)); filter: blur(6px); opacity: .9; animation: angle 4s linear infinite; z-index: -1; }
.card.cover .face.back { background: repeating-linear-gradient(45deg, var(--bg2) 0 12px, color-mix(in srgb, var(--accent) 12%, var(--bg2)) 12px 24px); }
.card.cover .face.back > * { display: none; }
.card.cover .face.back::after { content: "?"; font-size: 72px; font-weight: 900; color: var(--accent); }
.face.back dl { margin: 0; font-size: 13px; width: 100%; }
.face.back dt { color: var(--muted); }
.face.back dd { margin: 0 0 8px; font-weight: 700; }
.face.back .flavor { font-style: italic; color: var(--text); font-size: 13px; }
.custom-tag { position: absolute; top: 12px; right: 12px; font-size: 10px; padding: 2px 6px; border-radius: 5px; background: var(--tc); color: #000; font-weight: 800; }

.goals { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.goal { padding: 16px 18px; display: grid; grid-template-columns: 40px 1fr; gap: 4px 12px; align-items: center; }
.goal .gi { font-size: 26px; grid-row: span 2; filter: grayscale(.7); opacity: .8; }
.goal b { font-size: 15px; } .goal b small { color: var(--muted); font-weight: 400; }
.prog { height: 8px; border-radius: 999px; background: var(--heat0); overflow: hidden; }
.prog div { height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: inherit; transition: width 1.2s cubic-bezier(.2,.8,.2,1); }

/* closing */
.closing { text-align: center; min-height: 80vh; display: flex; flex-direction: column; justify-content: center; align-items: center; }
.closing p { max-width: 720px; font-size: 18px; color: var(--muted); }
.closing .next { font-size: clamp(40px, 8vw, 84px); font-weight: 900; margin: 24px 0 0; }
.btn { margin-top: 28px; padding: 12px 22px; border-radius: 999px; border: 0; cursor: pointer; font: inherit; font-weight: 700; color: #fff; background: linear-gradient(90deg, var(--accent), var(--accent3)); box-shadow: 0 8px 30px -8px var(--accent); }
footer { text-align: center; color: var(--muted); font-size: 12px; padding: 30px 16px 50px; position: relative; z-index: 1; }
.theme-toggle { position: fixed; top: 14px; right: 14px; z-index: 40; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--panel-border); background: var(--panel); color: var(--text); cursor: pointer; font-size: 18px; backdrop-filter: blur(8px); }

@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pop { from { transform: scale(0); } }
@keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } }
@keyframes digit { from { opacity: 0; transform: translateY(80%) rotateX(-90deg); } }
@keyframes blink { 50% { opacity: 0; } }
@keyframes bob { 50% { transform: translateY(6px); } }
@keyframes holo { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
@property --ang { syntax: "<angle>"; initial-value: 0deg; inherits: false; }
@keyframes angle { to { --ang: 360deg; } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .reveal { opacity: 1; transform: none; }
  .heat i { transform: none; }
  .card .inner { transform: none; }
}
</style>

if (S.top_language) facts.push(["💬", T.topLang, S.top_language]);
if (S.longest_streak_start) facts.push(["🔥", `${T.streak} ${S.longest_streak} ${T.days}`, `${S.longest_streak_start} → ${S.longest_streak_end}`]);
if (S.external_prs_merged) facts.push(["🧭", T.extPR, `${S.external_prs_merged} ${T.oss}`]);
if (S.private_contributions) facts.push(["🔒", T.privateC, fmt(S.private_contributions)]);
html.push(`<section id="stats">
  <h2 class="section-title reveal">${esc(T.statsT)}</h2><p class="section-sub reveal">${esc(T.statsS)}</p>
  <div class="stats">${statItems.map(([ico, n, l]) => `<div class="stat panel reveal"><div class="ico">${ico}</div><div class="num" data-count="${n}">0</div><div class="lbl">${esc(l)}</div></div>`).join("")}</div>
  <div class="fun-facts">${facts.map(([i, b, s]) => `<div class="fact panel reveal"><div class="big">${i}</div><div><b>${esc(b)}</b><small>${esc(s)}</small></div></div>`).join("")}</div>
</section>`);

// HEATMAP + CHARTS
const cal = D.calendar || [];
const nz = cal.map(d => d.count).filter(c => c > 0).sort((a, b) => a - b);
const q = p => nz.length ? nz[Math.min(nz.length - 1, Math.floor(p * nz.length))] : 1;
const [q1, q2, q3] = [q(.25), q(.5), q(.8)];
const lvl = c => c <= 0 ? 0 : c <= q1 ? 1 : c <= q2 ? 2 : c <= q3 ? 3 : 4;
let cells = "";
let monthLabels = "";
if (cal.length) {
  const pad = cal[0].weekday;
  for (let i = 0; i < pad; i++) cells += `<i style="visibility:hidden"></i>`;
  let lastMonth = -1;
  cal.forEach((d, i) => {
    const wk = Math.floor((i + pad) / 7);
    const m = +d.date.slice(5, 7) - 1;
    if (m !== lastMonth) { monthLabels += `<span style="left:${wk * 16}px">${esc(T.months[m])}</span>`; lastMonth = m; }
    cells += `<i data-l="${lvl(d.count)}" data-d="${d.date}" data-c="${d.count}" style="transition-delay:${wk * 18}ms"></i>`;
  });
}
const maxM = Math.max(1, ...D.monthly);
const topM = D.monthly.indexOf(Math.max(...D.monthly));
const monthBars = D.monthly.map((v, i) => `<div class="bar" title="${v}"><div class="fill${i === topM && v ? " top" : ""}" data-h="${(v / maxM) * 100}"></div><span>${esc(T.months[i])}</span></div>`).join("");
const maxW = Math.max(1, ...D.weekday);
const weekBars = D.weekday.map((v, i) => `<div class="bar" title="${v}"><div class="fill" data-h="${(v / maxW) * 100}"></div><span>${esc(T.weekdays[i])}</span></div>`).join("");
const hours = D.hours || [];
const maxH = Math.max(1, ...hours);
let clock = "";
if (S.sampled_commits > 0) {
  const parts = hours.map((v, h) => {
    const len = 18 + (v / maxH) * 72;
    const a = (h / 24) * Math.PI * 2 - Math.PI / 2;
    const x1 = 120 + Math.cos(a) * 26, y1 = 120 + Math.sin(a) * 26;
    const x2 = 120 + Math.cos(a) * len, y2 = 120 + Math.sin(a) * len;
    const col = h < 5 ? "var(--accent)" : h < 9 ? "var(--accent2)" : h < 18 ? "var(--legendary)" : "var(--accent3)";
    return `<line class="h" x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${col}" stroke-width="7" stroke-linecap="round" opacity="${.35 + .65 * v / maxH}" style="transition-delay:${h * 40}ms"><title>${h}:00 · ${v}</title></line>`;
  }).join("");
  const labels = [0, 6, 12, 18].map(h => { const a = (h / 24) * Math.PI * 2 - Math.PI / 2; return `<text x="${120 + Math.cos(a) * 108}" y="${124 + Math.sin(a) * 108}" fill="currentColor" font-size="11" text-anchor="middle" opacity=".6">${h}</text>`; }).join("");
  clock = `<div class="chart panel reveal"><h3>${esc(T.hourT)}</h3><svg class="clock" viewBox="0 0 240 240">${parts}${labels}<text x="120" y="126" text-anchor="middle" font-size="18" font-weight="800" fill="currentColor">${S.peak_hour}:00</text></svg></div>`;
} else {
  clock = `<div class="chart panel reveal"><h3>${esc(T.weekT)}</h3><div class="bars">${weekBars}</div></div>`;
}
html.push(`<section id="heat">
  <h2 class="section-title reveal">${esc(T.heatT)}</h2><p class="section-sub reveal">${esc(T.heatS)}</p>
  <div class="heat-wrap panel reveal"><div class="heat-months">${monthLabels}</div><div class="heat" id="heatGrid">${cells}</div>
  <div class="legend">${esc(T.less)} ${[0, 1, 2, 3, 4].map(l => `<i style="background:var(--heat${l})"></i>`).join("")} ${esc(T.more)}</div></div>
  <div class="charts"><div class="chart panel reveal"><h3>${esc(T.monthT)}</h3><div class="bars">${monthBars}</div></div>${clock}</div>
</section>`);

// LANGUAGES
const langs = (D.languages || []).filter(l => l.share >= .005);
if (langs.length) {
  const palette = ["#7c5cff", "#22d3ee", "#f472b6", "#facc15", "#34d399", "#fb923c", "#60a5fa", "#a3e635", "#e879f9", "#94a3b8"];
  langs.forEach((l, i) => { l._c = l.color || palette[i % palette.length]; });
  html.push(`<section id="langs">
    <h2 class="section-title reveal">${esc(T.langT)}</h2><p class="section-sub reveal">${esc(T.langS)}</p>
    <div class="panel reveal" style="padding:24px"><div class="langbar" id="langbar">${langs.map(l => `<div style="background:${esc(l._c)}" data-w="${l.share * 100}" title="${esc(l.name)}"></div>`).join("")}</div>
    <div class="langs">${langs.map(l => `<span><i style="background:${esc(l._c)}"></i>${esc(l.name)} <em>${(l.share * 100).toFixed(1)}%</em></span>`).join("")}</div></div>
  </section>`);
}

// PROJECTS
const np = N.projects || {};
const projects = (D.projects || []).filter(p => p.commits > 0 || p.is_new || np[p.id]);
const order = N.project_order || [];
projects.sort((a, b) => {
  const ia = order.indexOf(a.id), ib = order.indexOf(b.id);
  if (ia !== -1 || ib !== -1) return (ia === -1 ? 1e9 : ia) - (ib === -1 ? 1e9 : ib);
  return 0;
});
const shown = projects.slice(0, N.max_projects || 12);
if (shown.length) {
  html.push(`<section id="projects">
    <h2 class="section-title reveal">${esc(T.projT)}</h2><p class="section-sub reveal">${esc(T.projS)}</p>
    <div class="projects">${shown.map((p, i) => {
      const n = np[p.id] || {};
      const url = safeUrl(p.url);
      const name = url ? `<a href="${esc(url)}" target="_blank" rel="noopener">${esc(p.name)}</a>` : esc(p.name);
      const hl = (n.highlights || []).map(h => `<li>${esc(tr(h))}</li>`).join("");
      return `<article class="proj panel reveal" style="--lc:${esc(p.primary_color || "var(--accent)")}; transition-delay:${(i % 3) * 90}ms">
        <div class="rank">#${i + 1}</div>
        <h3>${name}${p.is_new ? `<span class="badge">${T.newB}</span>` : ""}${n.category ? `<span class="badge cat">${esc(tr(n.category))}</span>` : ""}${p.is_private ? `<span class="badge priv">${T.privB}</span>` : ""}</h3>
        ${n.tagline ? `<div class="tagline">${esc(tr(n.tagline))}</div>` : ""}
        ${p.description ? `<p class="desc">${esc(p.description)}</p>` : ""}
        ${hl ? `<ul>${hl}</ul>` : ""}
        ${p.topics?.length ? `<div class="topics">${p.topics.slice(0, 5).map(t => `<span>#${esc(t)}</span>`).join("")}</div>` : ""}
        <div class="meta">${p.primary_language ? `<span><i style="background:${esc(p.primary_color || "#888")}"></i>${esc(p.primary_language)}</span>` : ""}
          ${p.commits ? `<span>📝 ${fmt(p.commits)} ${T.commitsU}</span>` : ""}${p.stars ? `<span>${T.starsU} ${fmt(p.stars)}</span>` : ""}
          ${p.releases?.length ? `<span>🚀 ${esc(p.releases[0].tag)}</span>` : ""}</div>
      </article>`;
    }).join("")}</div>
  </section>`);
}

// ACHIEVEMENTS
const custom = (N.custom_achievements || []).map(c => ({ ...c, unlocked: true, custom: true, tier: c.tier || "epic" }));
const flavor = N.achievements || {};
const unlocked = [...custom, ...(D.achievements || []).filter(a => a.unlocked)];
const tierRank = { legendary: 3, epic: 2, rare: 1, common: 0 };
unlocked.sort((a, b) => (tierRank[b.tier] ?? 0) - (tierRank[a.tier] ?? 0));
const locked = (D.achievements || []).filter(a => !a.unlocked && a.eligible !== false && a.progress_to_next > 0).sort((a, b) => b.progress_to_next - a.progress_to_next).slice(0, 6);
const upgrades = (D.achievements || []).filter(a => a.unlocked && a.next_threshold && a.progress_to_next >= .4).slice(0, Math.max(0, 6 - locked.length));
const card = (a, i) => {
  const ti = tierRank[a.tier] ?? 0;
  const v = a.value !== undefined ? `<div class="val">${a.custom ? "" : `<span data-count="${a.value}">0</span>`}<small>${a.unit === "%" ? "%" : a.unit === "days" ? T.days : ""}</small></div>` : `<div class="val"></div>`;
  const desc = tr(a.desc).replace("{v}", fmt(a.value));
  const back = a.custom
    ? `<p class="flavor">${esc(tr(a.detail || a.desc))}</p>`
    : `<dl><dt>${T.value}</dt><dd>${fmt(a.value)}${a.unit === "%" ? "%" : ""}</dd>
        <dt>${T.unlockedAt}</dt><dd>${a.thresholds.map((t, k) => k <= ti ? `<b>${t}</b>` : t).join(" · ")}</dd>
        <dt>${T.nextTier}</dt><dd>${a.next_threshold ? `${fmt(a.next_threshold)} (${Math.round(a.progress_to_next * 100)}%)` : T.maxed}</dd></dl>
       ${flavor[a.id] ? `<p class="flavor">“${esc(tr(flavor[a.id]))}”</p>` : ""}`;
  return `<div class="card cover" data-tier="${esc(a.tier)}" data-i="${i}" tabindex="0">
    <div class="inner">
      <div class="face front">${a.custom ? `<span class="custom-tag">${T.special}</span>` : ""}
        <div class="tier">${esc(T.tiers[a.tier] || a.tier)}</div>
        <div class="emblem">${esc(a.icon || "🏅")}</div>
        <h4>${esc(tr(a.title))}</h4><p>${esc(desc)}</p>
        ${v}<div class="pips">${[0, 1, 2, 3].map(k => `<i class="${k <= ti ? "on" : ""}"></i>`).join("")}</div>
        <div class="shine"></div>
      </div>
      <div class="face back"><div class="tier">${esc(tr(a.title))}</div>${back}</div>
    </div></div>`;
};
const goalRow = a => {
  const pct = Math.round(a.progress_to_next * 100);
  return `<div class="goal panel reveal"><div class="gi">${esc(a.icon)}</div>
    <b>${esc(tr(a.title))} <small>${fmt(a.value)} / ${fmt(a.next_threshold)}${a.unit === "%" ? "%" : ""}</small></b>
    <div class="prog"><div data-w="${pct}"></div></div></div>`;
};
if (unlocked.length) {
  html.push(`<section id="achievements">
    <h2 class="section-title reveal"><span class="grad">${esc(T.achT)}</span> · ${unlocked.length}</h2><p class="section-sub reveal">${esc(T.achS)}</p>
    <div class="ach-grid" id="achGrid">${unlocked.map(card).join("")}</div>
  </section>`);
}
if (locked.length + upgrades.length) {
  html.push(`<section id="goals" style="padding-top:0">
    <h2 class="section-title reveal">${esc(T.goalT)}</h2><p class="section-sub reveal">${esc(T.goalS)}</p>
    <div class="goals">${[...locked, ...upgrades].map(goalRow).join("")}</div>
  </section>`);
}

// CLOSING
html.push(`<section class="closing" id="closing">
  ${N.summary ? `<p class="reveal">${esc(tr(N.summary))}</p>` : ""}
  ${N.closing ? `<p class="reveal">${esc(tr(N.closing))}</p>` : ""}
  <div class="next grad reveal">${esc(T.next)} ${Y + 1}</div>
  <button class="btn reveal" id="replay">${esc(T.replay)}</button>
</section>`);

app.innerHTML = html.join("");
$("#foot").textContent = `${T.footer} · ${D.meta.generated_at?.slice(0, 10) || ""} · @${P.login}`;

/* ---------- typed headline ---------- */
const headline = tr(N.headline) || (L === "zh"
  ? `今年你留下了 ${fmt(S.total_contributions)} 次貢獻，推進了 ${S.repos_contributed} 個專案。`
  : `You made ${fmt(S.total_contributions)} contributions across ${S.repos_contributed} projects this year.`);
const typed = $("#typed");
if (reduce) typed.textContent = headline;
else { let k = 0; setTimeout(function tick() { typed.textContent = headline.slice(0, ++k); if (k < headline.length) setTimeout(tick, 38); }, 1400); }

/* ---------- count-up ---------- */
function countUp(el) {
  const target = parseFloat(el.dataset.count) || 0;
  const dec = String(el.dataset.count).includes(".") ? 1 : 0;
  if (reduce) { el.textContent = dec ? target.toFixed(1) : fmt(target); return; }
  const t0 = performance.now(), dur = 1400;
  requestAnimationFrame(function step(t) {
    const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 4);
    el.textContent = dec ? (target * e).toFixed(1) : fmt(Math.round(target * e));
    if (p < 1) requestAnimationFrame(step);
  });
}

/* ---------- observers ---------- */
const io = new IntersectionObserver(entries => {
  for (const en of entries) {
    if (!en.isIntersecting) continue;
    const el = en.target;
    io.unobserve(el);
    el.classList.add("in");
    el.querySelectorAll("[data-count]").forEach(countUp);
    el.querySelectorAll(".fill[data-h]").forEach(f => f.style.height = f.dataset.h + "%");
    el.querySelectorAll("[data-w]").forEach(f => f.style.width = f.dataset.w + "%");
    el.querySelectorAll(".clock").forEach(c => c.classList.add("in"));
    if (el.id === "heatGrid") el.classList.add("in");
    if (el.id === "achGrid") dealCards(el);
  }
}, { threshold: .15 });
document.querySelectorAll(".reveal, #heatGrid, #achGrid").forEach(el => io.observe(el));

/* ---------- heatmap tooltip ---------- */
const tip = $("#tip");
$("#heatGrid")?.addEventListener("mousemove", e => {
  const c = e.target.closest("i[data-d]");
  if (!c) { tip.style.opacity = 0; return; }
  tip.textContent = `${c.dataset.d} · ${c.dataset.c}`;
  tip.style.left = e.clientX + 12 + "px"; tip.style.top = e.clientY - 30 + "px"; tip.style.opacity = 1;
});
$("#heatGrid")?.addEventListener("mouseleave", () => tip.style.opacity = 0);

/* ---------- achievement cards ---------- */
function dealCards(grid) {
  const cards = [...grid.querySelectorAll(".card")];
  let bigWin = false;
  cards.forEach((c, i) => {
    setTimeout(() => {
      c.classList.add("dealt");
      c.classList.remove("cover");
      c.querySelectorAll("[data-count]").forEach(countUp);
      if (c.dataset.tier === "legendary") burst(c);
    }, reduce ? 0 : 250 + i * 180);
    if (c.dataset.tier === "legendary" || c.dataset.tier === "epic") bigWin = true;
  });
  if (bigWin) setTimeout(() => confetti(160), reduce ? 0 : 300 + cards.length * 180);
}
document.addEventListener("click", e => {
  const c = e.target.closest(".card.dealt");
  if (c) c.classList.toggle("flipped");
});
document.addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.matches?.(".card.dealt")) { e.preventDefault(); e.target.classList.toggle("flipped"); }
});
if (!reduce) {
  document.addEventListener("pointermove", e => {
    const c = e.target.closest?.(".card.dealt");
    document.querySelectorAll(".card.tilt").forEach(x => { if (x !== c) { x.classList.remove("tilt"); x.style.transform = ""; } });
    if (!c || c.classList.contains("flipped")) return;
    const r = c.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5;
    c.classList.add("tilt");
    c.style.transform = `rotateY(${x * 18}deg) rotateX(${-y * 18}deg) scale(1.04)`;
    const s = c.querySelector(".shine"); if (s) s.style.setProperty("--sx", `${(x + .5) * 100}%`);
  });
}

/* ---------- starfield ---------- */
const sc = $("#stars"), sx = sc.getContext("2d");
let stars = [];
function resize() {
  const dpr = devicePixelRatio || 1;
  for (const c of [sc, $("#confetti")]) { c.width = innerWidth * dpr; c.height = innerHeight * dpr; c.style.width = innerWidth + "px"; c.style.height = innerHeight + "px"; c.getContext("2d").setTransform(dpr, 0, 0, dpr, 0, 0); }
  stars = Array.from({ length: Math.min(160, Math.floor(innerWidth * innerHeight / 9000)) }, () => ({ x: Math.random() * innerWidth, y: Math.random() * innerHeight, r: Math.random() * 1.4 + .2, s: Math.random() * .3 + .05, p: Math.random() * 6 }));
}
resize(); addEventListener("resize", resize);
(function drawStars(t) {
  sx.clearRect(0, 0, innerWidth, innerHeight);
  const light = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim().startsWith("#f");
  for (const s of stars) {
    if (!reduce) { s.y -= s.s; if (s.y < 0) { s.y = innerHeight; s.x = Math.random() * innerWidth; } }
    const a = .35 + .35 * Math.sin((t || 0) / 900 + s.p);
    sx.fillStyle = light ? `rgba(90,80,200,${a * .5})` : `rgba(210,220,255,${a})`;
    sx.beginPath(); sx.arc(s.x, s.y, s.r, 0, 7); sx.fill();
  }
  if (!reduce) requestAnimationFrame(drawStars);
})();

/* ---------- confetti ---------- */
const cc = $("#confetti"), cx = cc.getContext("2d");
let parts = [], running = false;
const colors = ["#7c5cff", "#22d3ee", "#f472b6", "#ffb020", "#34d399", "#ffffff"];
function spawn(x, y, n, spread) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = Math.random() * spread + 2;
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 4, g: .18, s: Math.random() * 6 + 3, r: Math.random() * 6, vr: Math.random() * .3 - .15, c: colors[i % colors.length], life: 1 });
  }
  if (!running) { running = true; requestAnimationFrame(loop); }
}
function loop() {
  cx.clearRect(0, 0, innerWidth, innerHeight);
  parts = parts.filter(p => p.life > 0 && p.y < innerHeight + 20);
  for (const p of parts) {
    p.vy += p.g; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life -= .006;
    cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.globalAlpha = Math.max(0, p.life);
    cx.fillStyle = p.c; cx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); cx.restore();
  }
  if (parts.length) requestAnimationFrame(loop); else { running = false; cx.clearRect(0, 0, innerWidth, innerHeight); }
}
function confetti(n) { if (reduce) return; spawn(innerWidth * .25, innerHeight * .6, n / 2, 12); spawn(innerWidth * .75, innerHeight * .6, n / 2, 12); }
function burst(el) { if (reduce) return; const r = el.getBoundingClientRect(); spawn(r.left + r.width / 2, r.top + r.height / 2, 40, 7); }
$("#replay").addEventListener("click", () => confetti(220));
const closingObs = new IntersectionObserver(es => { if (es[0].isIntersecting) { confetti(200); closingObs.disconnect(); } }, { threshold: .6 });
closingObs.observe($("#closing"));

/* ---------- theme toggle ---------- */
$("#themeBtn").addEventListener("click", () => {
  const root = document.documentElement;
  const cur = root.dataset.theme || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
  root.dataset.theme = cur === "light" ? "dark" : "light";
});
})();
</script>
</body>
</html>
