<svg xmlns="http://www.w3.org/2000/svg" width="300" height="420" viewBox="0 0 300 420" role="img" aria-label="爆肝日">
<defs>
  <radialGradient id="bg" cx="50%" cy="0%" r="110%"><stop offset="0" stop-color="#b46cff" stop-opacity=".45"/><stop offset=".6" stop-color="#2a1245"/><stop offset="1" stop-color="#0b0d18"/></radialGradient>
  <linearGradient id="shine" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <linearGradient id="holo" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#ff0080"/><stop offset=".25" stop-color="#ffcc00"/><stop offset=".5" stop-color="#00ffaa"/><stop offset=".75" stop-color="#00aaff"/><stop offset="1" stop-color="#aa00ff"/></linearGradient>
  <clipPath id="clip"><rect width="300" height="420" rx="22"/></clipPath>
</defs>
<style>
  .pop { animation: pop .9s cubic-bezier(.2,1.6,.4,1) both; transform-origin: 150px 140px; }
  .fade { animation: fade .8s .4s both; }
  .spin { animation: spin 14s linear infinite; transform-origin: 150px 140px; }
  @keyframes pop { from { transform: scale(0); } }
  @keyframes fade { from { opacity: 0; transform: translateY(10px); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<g clip-path="url(#clip)">
  <rect width="300" height="420" fill="url(#bg)"/>
  <rect width="300" height="420" rx="22" fill="url(#holo)" opacity=".14" style="mix-blend-mode:screen"><animate attributeName="x" values="-300;300" dur="5s" repeatCount="indefinite"/></rect>
  <rect x="-200" y="0" width="160" height="420" fill="url(#shine)" transform="skewX(-20)"><animate attributeName="x" values="-260;520" dur="3.2s" repeatCount="indefinite"/></rect>
</g>
<rect x="1.5" y="1.5" width="297" height="417" rx="21" fill="none" stroke="#b46cff" stroke-opacity=".75" stroke-width="2"/>

<text x="150" y="42" text-anchor="middle" font-family="'Inter','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="12" font-weight="800" letter-spacing="3" fill="#b46cff">史詩</text>
<circle class="spin" cx="150" cy="140" r="56" fill="none" stroke="#b46cff" stroke-opacity=".6" stroke-width="2" stroke-dasharray="6 7"/>
<circle cx="150" cy="140" r="46" fill="#b46cff" fill-opacity=".14"/>
<text class="pop" x="150" y="160" text-anchor="middle" font-size="54">⚡</text>
<g class="fade" font-family="'Inter','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" text-anchor="middle">
  <text x="150" y="232" font-size="24" font-weight="800" fill="#eef0ff">爆肝日</text>
  <text x="150" y="260" font-size="13" fill="#a7adc8">單日最高 47 次貢獻</text>
  <rect x="108" y="300" width="24" height="5" rx="2.5" fill="#b46cff"/><rect x="138" y="300" width="24" height="5" rx="2.5" fill="#b46cff"/><rect x="168" y="300" width="24" height="5" rx="2.5" fill="#b46cff"/><rect x="198" y="300" width="24" height="5" rx="2.5" fill="#ffffff22"/>
  <text x="150" y="380" font-size="12" fill="#a7adc8">@demo-dev · 2026</text>
</g>
</svg>